{% extends "core/base.html" %}
{% load static %}

{% block title %}房間列表｜麻將戰績簿{% endblock %}

{% block content %}
  <main class="mx-auto max-w-4xl px-6 py-16 sm:px-10 sm:py-24">
    <header class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-bold tracking-[.16em] text-blue-600">MAJON</p>
        <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-5xl">我的房間</h1>
        <p class="mt-3 text-stone-500">選擇房間，查看對局紀錄與麻將規則。</p>
      </div>
      <span id="room-total-count" class="rounded-full border border-stone-300 bg-white/50 px-4 py-2 text-sm font-bold text-stone-600">正在載入房間</span>
    </header>

    <form id="room-search-form" action="{% url 'majon:room-list-data' %}" class="paper-card mt-8 flex gap-3 rounded-2xl p-3">
      <label for="q" class="sr-only">搜尋房間</label>
      <input id="q" name="q" type="search" placeholder="搜尋房間名稱" autocomplete="off" class="min-w-0 flex-1 bg-transparent px-3 py-2 outline-none placeholder:text-stone-400">
      <button type="submit" class="rounded-xl bg-stone-800 px-5 py-2 font-bold text-white hover:bg-stone-700">搜尋</button>
    </form>

    <p id="room-list-status" class="mt-5 text-sm text-stone-500" role="status" aria-live="polite">正在載入房間。</p>
    <div id="room-list-error" class="mt-4" aria-live="assertive"></div>

    <section id="room-list" class="mt-5 space-y-4" aria-busy="true" aria-label="房間列表">
      {% for skeleton in "123" %}
        <div class="paper-card animate-pulse rounded-2xl p-5 sm:p-6" aria-hidden="true">
          <div class="h-6 w-2/5 rounded bg-stone-200"></div>
          <div class="mt-4 h-4 w-1/4 rounded bg-stone-200"></div>
          <div class="mt-3 h-4 w-1/3 rounded bg-stone-200"></div>
        </div>
      {% endfor %}
    </section>

    <nav id="room-pagination" class="mt-8 flex flex-wrap justify-center gap-2" aria-label="房間列表分頁"></nav>

    <div class="mt-8 text-center">
      <a href="{% url 'majon:room-create' %}" class="inline-flex items-center justify-center rounded-full bg-blue-600 px-6 py-3 font-bold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-blue-700">＋ 建立新房間</a>
    </div>
  </main>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'majon/js/room_list.js' %}" defer></script>
{% endblock %}
