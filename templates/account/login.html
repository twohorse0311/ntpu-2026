{% extends "core/base.html" %}
{% load socialaccount %}
{% block title %}登入｜麻將戰績簿{% endblock %}
{% block content %}
    <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
      <section class="w-full rounded-3xl border border-stone-200 bg-white p-8 shadow-sm">
        <a href="{% url 'majon:room-list' %}" class="text-sm font-bold text-blue-600">
          ← 回到我的房間
        </a>

        <h1 class="mt-6 text-3xl font-black">登入</h1>
        <p class="mt-3 text-stone-500">登入後即可使用你的帳號。</p>

        <form method="post" action="{% provider_login_url 'google' process='login' %}" class="mt-8">
          {% csrf_token %}
          <button
            type="submit"
            class="flex w-full items-center justify-center gap-3 rounded-xl border border-stone-300 bg-white px-5 py-3 font-bold text-stone-700 transition hover:border-stone-400 hover:bg-stone-50 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2"
          >
            <span aria-hidden="true" class="flex h-5 w-5 items-center justify-center rounded-full bg-[#4285F4] text-xs font-black text-white">G</span>
            使用 Google 帳號登入
          </button>
        </form>

        <div class="my-7 flex items-center gap-4" aria-hidden="true">
          <div class="h-px flex-1 bg-stone-200"></div>
          <span class="text-xs font-medium text-stone-400">或使用帳號密碼</span>
          <div class="h-px flex-1 bg-stone-200"></div>
        </div>

        <form method="post" action="{% url 'account_login' %}" class="space-y-4">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="w-full rounded-xl bg-blue-600 px-5 py-3 font-bold text-white">
            登入
          </button>
        </form>

        <p class="mt-6 text-sm text-stone-500">
          還沒有帳號？
          <a href="{% url 'account_signup' %}" class="font-bold text-blue-600">註冊</a>
        </p>
      </section>
    </main>
{% endblock %}
